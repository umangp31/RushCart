<div class="shell">
  <aside class="rail">
    <div class="brand">
      <h1>RushCart</h1>
      <span>Ops</span>
    </div>

    <nav class="tabs" aria-label="Sections">
      <a routerLink="/inventory" routerLinkActive="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5.5 8 2.5l6 3v5l-6 3-6-3z"/><path d="M2 5.5l6 3 6-3M8 8.5v5"/></svg>
        Inventory
      </a>
      <a routerLink="/orders" routerLinkActive="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>
        Orders
      </a>
      <a routerLink="/status" routerLinkActive="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8h3l1.5-4 3 8 1.5-4h4"/></svg>
        Resilience
      </a>
      <a routerLink="/metrics" routerLinkActive="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 13.5V9M6.5 13.5V5M10.5 13.5V7.5M14.5 13.5V3"/></svg>
        Metrics
      </a>
      <a routerLink="/simulate" routerLinkActive="active">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2.5v4.2L2.3 12a1 1 0 0 0 .9 1.5h9.6a1 1 0 0 0 .9-1.5L11 6.7V2.5M4 2.5h8M4 10h8"/></svg>
        Simulate
      </a>
      <a routerLink="/guide" routerLinkActive="active" class="nav-guide">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h6.5L13 6v7.5H3z"/><path d="M9.5 2.5V6H13M5.5 9h5M5.5 11.5h5"/></svg>
        Guide
      </a>
    </nav>

    <div class="rail-foot">
      <div class="health">
        <span class="dot" [class.up]="health() === 'UP'" [class.down]="health() !== 'UP' && health() !== '…'"></span>
        <span>API {{ health() === 'UP' ? 'healthy' : health() === '…' ? 'checking' : 'unreachable' }}</span>
      </div>
      <span class="mono">/api/v1 · polled 10s</span>
    </div>
  </aside>

  <main>
    <router-outlet />
  </main>
</div>
<app-toasts />
