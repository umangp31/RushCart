spring:
  application:
    name: rushcart
  threads:
    virtual:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      reservationWrite:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-closed-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
